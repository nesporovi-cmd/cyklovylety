<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYKLOVÝLETY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --green: #2d6a2d;
    --green-light: #3d8f3d;
    --green-dark: #1a4a1a;
    --amber: #d4860a;
    --amber-light: #f0a820;
    --cream: #f5f0e8;
    --earth: #8b6914;
    --dark: #1a1a0e;
    --trail: #5a9e2f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'Barlow', sans-serif;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* --- HEADER --- */
  header {
    position: relative;
    background: var(--green-dark);
    border-bottom: 4px solid var(--amber);
    padding: 0;
    overflow: hidden;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 18px 32px 16px;
    position: relative;
    z-index: 2;
  }

  .hero-img {
    width: 220px;
    min-width: 140px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--amber);
    box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    flex-shrink: 0;
  }

  @media (max-width: 560px) { .hero-img { display: none; } }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 88px);
    letter-spacing: 6px;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--green-dark), 0 0 40px rgba(212,134,10,0.4);
    line-height: 1;
  }

  .subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--amber-light);
    margin-top: 4px;
  }

  /* Tyre track decoration */
  .tyre-track {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: repeating-linear-gradient(90deg,
      var(--amber) 0px, var(--amber) 12px,
      transparent 12px, transparent 20px
    );
    opacity: 0.4;
  }

  .stats-bar {
    background: var(--green-dark);
    border-bottom: 2px solid rgba(212,134,10,0.3);
    padding: 8px 32px;
    display: flex;
    gap: 32px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--amber-light);
  }

  .stats-bar span { color: var(--cream); }

  /* --- MAP --- */
  #map-wrap {
    position: relative;
    height: 65vh;
    min-height: 400px;
    border-bottom: 4px solid var(--amber);
  }

  #map { width: 100%; height: 100%; }

  /* Custom Leaflet popup */
  .leaflet-popup-content-wrapper {
    background: var(--green-dark) !important;
    border: 2px solid var(--amber) !important;
    border-radius: 8px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
    font-family: 'Barlow', sans-serif !important;
    color: var(--cream) !important;
    min-width: 200px;
  }

  .leaflet-popup-tip {
    background: var(--amber) !important;
  }

  .leaflet-popup-content {
    margin: 14px 16px !important;
    font-size: 14px;
    line-height: 1.5;
  }

  .popup-kde {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--amber-light);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .popup-kdy {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(245,240,232,0.65);
    margin-bottom: 10px;
  }

  .popup-links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .popup-btn {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 4px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.15s;
  }

  .popup-btn-foto {
    background: var(--amber);
    color: var(--dark);
  }

  .popup-btn-foto:hover { background: var(--amber-light); }

  .popup-btn-mapa {
    background: transparent;
    color: var(--amber-light);
    border: 1px solid var(--amber);
  }

  .popup-btn-mapa:hover { background: rgba(212,134,10,0.15); }

  /* Custom bike marker */
  .bike-marker {
    background: #fff;
    border: 2.5px solid #1a1a0e;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }

  .bike-marker:hover { transform: scale(1.2); box-shadow: 0 5px 16px rgba(0,0,0,0.45); }

  .bike-marker-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
  }

  /* --- TRIP LIST --- */
  #trips {
    padding: 32px 32px 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section-head {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 4px;
    color: var(--amber-light);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-head::after {
    content: '';
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, var(--amber), transparent);
  }

  .trip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }

  .trip-card {
    background: var(--green-dark);
    border: 1px solid rgba(212,134,10,0.25);
    border-left: 3px solid var(--amber);
    border-radius: 6px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: block;
    position: relative;
    overflow: hidden;
  }

  .trip-card::before {
    content: '🚲';
    position: absolute;
    right: 10px;
    bottom: 8px;
    font-size: 28px;
    opacity: 0.07;
    transition: opacity 0.2s;
  }

  .trip-card:hover {
    border-color: var(--amber);
    background: var(--green);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }

  .trip-card:hover::before { opacity: 0.15; }

  .card-kdy {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 5px;
  }

  .card-kde {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .card-links {
    display: flex;
    gap: 6px;
  }

  .card-link {
    font-size: 11px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 3px;
    transition: all 0.15s;
  }

  .card-link-foto {
    background: var(--amber);
    color: var(--dark);
  }

  .card-link-foto:hover { background: var(--amber-light); }

  .card-link-loc {
    color: var(--amber-light);
    border: 1px solid rgba(212,134,10,0.4);
  }

  .card-link-loc:hover {
    background: rgba(212,134,10,0.15);
    border-color: var(--amber);
  }

  /* footer */
  footer {
    text-align: center;
    padding: 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(245,240,232,0.35);
    border-top: 1px solid rgba(212,134,10,0.15);
  }

  /* Map attribution fix */
  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>

// Update count
document.getElementById('count').textContent = trips.length;

// --- MAP ---
const map = L.map('map', {
  center: [49.8, 15.5],
  zoom: 7,
  zoomControl: true
});

L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="https://opentopomap.org">OpenTopoMap</a>',
  maxZoom: 17
}).addTo(map);

function bikeIcon() {
  return L.divIcon({
    className: '',
    html: '<div class="bike-marker"><div class="bike-marker-inner"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a1a0e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 10 7h5l3.5 9"/><path d="M10 7h5"/><path d="M8 11h6"/><circle cx="14" cy="5" r="1"/></svg></div></div>',
    iconSize: [36, 36],
    iconAnchor: [18, 36],
    popupAnchor: [0, -36]
  });
}

// Place markers
trips.forEach(function(t, i) {
  var marker = L.marker([t.lat, t.lng], { icon: bikeIcon() });
  var popup = L.popup({ maxWidth: 280 }).setContent(
    '<div class="popup-kde">' + t.kde + '</div>' +
    '<div class="popup-kdy">' + t.kdy + '</div>' +
    '<div class="popup-links">' +
      '<a class="popup-btn popup-btn-foto" href="' + t.foto + '">📷 Fotoalbum</a>' +
      '<a class="popup-btn popup-btn-mapa" href="' + t.loc + '">🗺 Lokalita</a>' +
    '</div>'
  );
  marker.bindPopup(popup);
  marker.addTo(map);
  t._marker = marker;
});

// --- CARD GRID ---
var grid = document.getElementById('grid');
trips.forEach(function(t) {
  var card = document.createElement('div');
  card.className = 'trip-card';
  card.innerHTML =
    '<div class="card-kdy">' + t.kdy + '</div>' +
    '<div class="card-kde">' + t.kde + '</div>' +
    '<div class="card-links">' +
      '<span class="card-link card-link-foto"><a href="' + t.foto + '" style="text-decoration:none;color:inherit">📷 Foto</a></span>' +
      '<span class="card-link card-link-loc"><a href="' + t.loc + '" style="text-decoration:none;color:inherit">🗺 Mapa</a></span>' +
    '</div>';
  card.style.cursor = 'pointer';
  card.addEventListener('click', (function(trip) {
    return function(e) {
      if (e.target.tagName === 'A') return;
      map.flyTo([trip.lat, trip.lng], 13, { duration: 1.2 });
      document.getElementById('map-wrap').scrollIntoView({ behavior: 'smooth' });
      trip._marker.openPopup();
    };
  })(t));
  grid.appendChild(card);
});

</script>
